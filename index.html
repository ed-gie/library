<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <table>
        <caption>Library Index</caption>
        <colgroup>
            <col span="2">
            <col class="title">
        </colgroup>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>ID number</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <button class="new-book-btn">New Book</button>
    <dialog id="new-book">
        <form action="" method="dialog">
            <button class="close-btn" command="close" commandfor="new-book"><svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24">
                    <path
                        d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
                </svg></button>

            <div class="title">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="author">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="pages">
                <label for="pages">Pages</label>
                <input type="number" id="pages" name="pages" required>
            </div>

            <div class="status">
                <label for="status">Read?</label>
                <select name="status" id="status">
                    <option value="yes">Yes</option>
                    <option value="no" selected>No</option>
                </select>
            </div>

            <button class="submit-btn" command="submit" commandfor="new-book">Submit</button>
        </form>
    </dialog>

    <script src="index.js"></script>
</body>

</html>
